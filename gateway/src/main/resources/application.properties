server.port=8885
websocket.port=8884

# IM服务地址
im.url=http://wildfirechat.net

# ========== BotFather 配置 ==========

# BotFather 功能开关（true=启用，false=关闭）
botfather.enabled=true

# BotFather 机器人配置
botfather.robot.id=robotfather
botfather.robot.name=机器人工厂
botfather.robot.secret=123456

# 管理后台配置（用于创建机器人）
botfather.admin.url=http://wildfirechat:18080
botfather.admin.secret=123456

# 服务回调地址配置
# 创建机器人时，自动设置此地址为机器人的回调地址
botfather.callbackUrl=http:///43.143.148.156:8885/robot/recvmsg

# 公网地址配置（必填）
# 用户连接此地址来使用创建的机器人，创建机器人后会发送给用户
botfather.publicAddr=ws://82.157.141.188:8884/robot/gateway

# 每个用户最大机器人数量（默认1）
botfather.maxRobotsPerUser=1

# AI消息使用的line（默认2，普通消息line为0，朋友圈为1）
# 欢迎语发送到此线路，用户可接着在 line 2 与机器人交互（控制面板）
botfather.aiLine=2

logging.level.root=DEBUG
logging.level.cn.wildfirechat.openclaw=DEBUG