# Example Hermes Agent config snippet for the Wildfire IM platform adapter.
# Place this under your ~/.hermes/config.yaml (or merge with existing config).

wildfire:
  enabled: true
  # robot-gateway WebSocket endpoint
  gateway_url: ws://localhost:8884/robot/gateway
  # Wildfire IM robot credentials
  robot_id: YourRobotId
  robot_secret: YourRobotSecret
  # Default destination for cron jobs / notifications
  # home_channel: "user:someUserId"
  # Group behavior
  require_mention: true
  help_keywords: "帮,请,分析,总结,怎么,如何"
  # Access control (empty = allow all)
  allowed_users: []
  allowed_groups: []
